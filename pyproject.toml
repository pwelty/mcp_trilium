[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-trilium"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for interacting with TriliumNext/Trilium Notes via the ETAPI"
authors = [{name = "Paul Welty", email = "paul@synaxis.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "trilium", "notes", "knowledge-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",  
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "mcp>=1.25,<2",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/pwelty/mcp-trilium"
Repository = "https://github.com/pwelty/mcp-trilium"
Issues = "https://github.com/pwelty/mcp-trilium/issues"
Author = "https://www.paulwelty.com"
Company = "https://www.synaxis.ai"

[project.scripts]
mcp-trilium = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]